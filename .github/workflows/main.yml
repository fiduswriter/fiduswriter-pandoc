name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
# Allows you to run this workflow manually from the Actions tab
  workflow_dispatch: {}

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          pip install pip --upgrade
          if grep version pyproject.toml | grep -q "dev";
            then pip install https://github.com/fiduswriter/fiduswriter/archive/develop.zip;
            else pip install https://github.com/fiduswriter/fiduswriter/archive/main.zip;
          fi
          if grep version pyproject.toml | grep -q "dev";
            then pip install https://github.com/fiduswriter/fiduswriter-books/archive/develop.zip;
            else pip install https://github.com/fiduswriter/fiduswriter-books/archive/main.zip;
          fi
      - uses: pre-commit/action@v3.0.1
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/checkout@v6
      - uses: nanasess/setup-chromedriver@v3
      - name: Install dependencies
        run: |
          pip install requests[security]
          pip install coverage
          pip install coveralls
          pip install packaging
          pip install webdriver-manager
          pip install selenium
          pip install wheel
          pip install pip --upgrade
          if grep version pyproject.toml | grep -q "dev";
            then pip install https://github.com/fiduswriter/fiduswriter/archive/develop.zip;
            else pip install https://github.com/fiduswriter/fiduswriter/archive/main.zip;
          fi
          if grep version pyproject.toml | grep -q "dev";
            then pip install https://github.com/fiduswriter/fiduswriter-books/archive/develop.zip;
            else pip install https://github.com/fiduswriter/fiduswriter-books/archive/main.zip;
          fi
          cd fiduswriter
          mv ../ci/configuration.py ./
          mv ../ci/.coveragerc ./
          coverage run --concurrency=multiprocessing,thread $(which fiduswriter) setup --no-static
      - name: Run test pandoc
        uses: nick-invision/retry@v4
        with:
          timeout_minutes: 8
          max_attempts: 3
          retry_on: error
          command: |
            cd fiduswriter
            coverage run --concurrency=multiprocessing,thread $(which fiduswriter) test pandoc
      - name: Upload failed test screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: failure-artifacts
          path: ${{ github.workspace }}/fiduswriter/screenshots/
      - name: Coveralls
        run: |
          cd fiduswriter
          coverage combine
          coveralls --service=github
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
